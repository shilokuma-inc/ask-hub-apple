name: Commander/Watch
run-name: Commander/Watch

# 司令塔の見張り（状態リポジトリで動かす）。司令塔そのものが止まると通知も止まるので、司令塔の生きている印（commander.json の seenAt）が
# 30 分より古い・無い・読めないときに、github-actions[bot] が Issue を立てる（bot の書き込みなので、Watch している人に GitHub の通知が届く）。
# 戻ったら（新しい seenAt を見たら）その Issue にコメントして閉じる。
#
# 正本は shilokuma-inc/ask-hub-apple の Tools/askhub-state/commander-watch.yml で、判定は同じリポジトリの Tools/commander_watch.py。
# このファイルは `python3 Tools/commander_watch.py render-workflow` で書き出したもの。ここを直接直さず、正本を直して書き出し直す。
# 入れ方・更新・止め方は ask-hub-apple の docs/renewal/operations.md の「司令塔の見張り」。

on:
  schedule:
    # 1 時間ごと（毎時 23 分。GitHub は 0 分ちょうどに混んで遅れやすいのでずらす）。
    # private のリポジトリでは、1 回のジョブが 1 分に切り上げて数えられる。1 時間ごとで月 720 分（Free の organization の 2,000 分の 36%）。
    # 30 分ごとだと月 1,440 分（72%）になり、ほかの private のリポジトリの枠を圧迫する。止まってから気づくまでは、
    # 30 分（古さの判定）+ 最大 1 時間（間隔）+ 定期実行の遅れ
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Issue を立てたり閉じたりせず、判定だけを Job Summary に出す
        type: boolean
        default: false

permissions: {}

# 同時に 1 つだけ（定期実行と手での起動が重なって、Issue を 2 つ立てないように）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  watch:
    name: watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # commander.json を読む
      issues: write    # 見張りの Issue を立てる・コメントする・閉じる

    steps:
      - name: Checkout the watcher
        # 判定（Tools/commander_watch.py）だけを、固定したコミットから取り出す。ask-hub-apple は public なので、ほかの秘密は要らない
        uses: actions/checkout@v7
        with:
          repository: shilokuma-inc/ask-hub-apple
          ref: __ASK_HUB_APPLE_SHA__
          path: ask-hub-apple
          sparse-checkout: Tools/commander_watch.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Watch
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          args=(check --repo "$GITHUB_REPOSITORY" --summary "$GITHUB_STEP_SUMMARY")
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 ask-hub-apple/Tools/commander_watch.py "${args[@]}"
