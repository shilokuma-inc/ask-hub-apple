name: Upload

# develop / release/** への push で Archive → IPA Export → App Store Connect へアップロードする。
# epic ブランチ（最終 PR の head）を TestFlight で確認したいときは、手動実行（workflow_dispatch）でそのブランチを選ぶ
# （AskHub アプリの「TestFlight に上げる」も同じ workflow_dispatch を呼ぶ）。
# push ごとに上げると App Store Connect の 24 時間あたりのアップロード上限に当たるため、作業ブランチでは自動では上げない。
# 入力（inputs）は置かない。ブランチの選択だけで足りる
on:
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

# アップロード途中でキャンセルすると App Store Connect 側に中途半端なビルドが残るため、
# 実行中のものは完了させる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    # App Store Connect にアプリが無いリポジトリではリポジトリ変数 ENABLE_DELIVERY=false でスキップする（template-app-ios と同じ）。
    # 未設定なら従来どおりアップロードする
    if: vars.ENABLE_DELIVERY != 'false'
    uses: ./.github/workflows/_archive.yml
    with:
      upload: true
    secrets: inherit
