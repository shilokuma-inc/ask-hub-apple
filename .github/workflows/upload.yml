name: Upload

# develop / release/** への push で Archive → Export → App Store Connect へアップロードする（iOS と macOS）。
# epic ブランチ（最終 PR の head）を TestFlight で確認したいときは、手動実行（workflow_dispatch）でそのブランチを選ぶ
# （AskHub アプリの「TestFlight に上げる」も同じ workflow_dispatch を呼ぶ）。
# push ごとに上げると App Store Connect の 24 時間あたりのアップロード上限に当たるため、作業ブランチでは自動では上げない。
# 入力（inputs）は置かない。ブランチの選択だけで足りる
on:
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:

permissions: {}

# アップロード途中でキャンセルすると App Store Connect 側に中途半端なビルドが残るため、
# 実行中のものは完了させる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    # App Store Connect にアプリが無いリポジトリではリポジトリ変数 ENABLE_DELIVERY=false でスキップする（template-app-ios と同じ）。
    # 未設定なら従来どおりアップロードする
    if: vars.ENABLE_DELIVERY != 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: iOS
      upload: true
    secrets: inherit

  upload-macos:
    # iOS とは別のジョブにし、macOS が失敗しても iOS のアップロードは止めない（並べて動かす。macOS のランナーは 2 台使う）。
    # App Store Connect のアプリに macOS のプラットフォームが無いうちは、_archive.yml が確かめて archive を飛ばす（失敗にしない）。
    # macOS だけを止めたいときはリポジトリ変数 ENABLE_MACOS_DELIVERY=false にする。未設定なら上の確認に任せる（docs/release.md）
    if: vars.ENABLE_DELIVERY != 'false' && vars.ENABLE_MACOS_DELIVERY != 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: macOS
      upload: true
    secrets: inherit
