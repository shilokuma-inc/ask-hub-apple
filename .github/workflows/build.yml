name: Build

# assets/** はスクリーンショット置き場でアプリのコードを含まないため除外する。
on:
  push:
    branches:
      - '**'
      - '!assets/**'
  pull_request:

permissions:
  contents: read

# 同じブランチへの連続 push では古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # push で実行済みのブランチの PR は二重に実行しない（Fork からの PR のみ pull_request で実行）
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/_build.yml
    with:
      # 作業ブランチへの push では Unit テストだけ実行し、develop / main / release/** と Fork からの PR では UI テストも実行する
      ui-tests: >-
        ${{ github.event_name == 'pull_request'
        || github.ref == 'refs/heads/develop'
        || github.ref == 'refs/heads/main'
        || startsWith(github.ref, 'refs/heads/release/') }}
