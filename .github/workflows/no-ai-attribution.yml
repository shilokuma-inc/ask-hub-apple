name: No AI Attribution

# コミットメッセージと PR 本文に AI 帰属行（Co-Authored-By など）が入っていないかを確かめる。
# Claude Code は既定でこれらを付けるため、設定が入っていない Mac やクラウドのセッションで作った PR を止める
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check commits and PR body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # m: 行頭の ^ を各行に効かせる / i: 大文字小文字を区別しない
          filter='test("^Co-Authored-By:|Generated with \\[Claude Code\\]|noreply@anthropic\\.com"; "mi")'
          shas=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq ".[] | select(.commit.message | $filter) | .sha[0:7]")
          body=$(gh api "repos/$REPO/pulls/$PR" --jq "(.body // \"\") | $filter")
          found=0
          for sha in $shas; do
            echo "::error::コミット $sha のメッセージに AI 帰属行があります"
            found=1
          done
          if [[ "$body" == "true" ]]; then
            echo "::error::PR 本文に AI 帰属行があります"
            found=1
          fi
          exit "$found"
