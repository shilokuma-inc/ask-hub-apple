name: Metadata/App Store

# App Store の説明文・キーワード・プロモーションテキスト・最新情報・URL を App Store Connect に反映する。手動実行のみ。
#
# 元ネタは AppStore/metadata/<言語>.json と shared.json。欠損と文字数超過は
# Verify/App Store metadata が PR の時点で落とすので、ここまで来たものは通る前提。
# 最新情報（whatsNew）は、JSON の whatsNew.version が反映先のバージョンと一致するときだけ書き込む。
# テンプレートの仮の文言（TODO:）が残っているあいだは、dry-run でも止まる。
#
# 反映先は「編集できる状態のバージョン」だけ。審査中・配信済みのバージョンには触らない。
# iOS と macOS のバージョンの両方に、同じ JSON を反映する（App Store Connect のバージョンはプラットフォームごとに別にある）。
# macOS のバージョンが無い（macOS のプラットフォームを追加していない・バージョンを作っていない）ときは、
# macOS を飛ばして iOS だけで続け、Job Summary に知らせる。vars.ENABLE_MACOS_DELIVERY=false なら macOS には反映しない。
# dry_run にすると、App Store Connect の現在値との差分だけを出して何も書き込まない。
# 手順と人がすることは docs/release.md の「App Store のメタデータ」。

on:
  workflow_dispatch:
    inputs:
      languages:
        description: '反映する言語（カンマ区切り）。空なら languages.json の全言語'
        required: false
        default: ''
      app_version:
        description: '反映先のバージョン。空なら編集できるバージョンを自動で選ぶ'
        required: false
        default: ''
      missing_locales:
        description: 'App Store Connect にその言語が無いときの扱い'
        type: choice
        options:
          - fail
          - skip
          - create
        default: fail
      dry_run:
        description: '書き込まず、現在値との差分だけ出す'
        type: boolean
        default: true

permissions: {}

# 同じブランチで 2 つ同時に書き込まない。途中で止めると言語の一部だけ書き換わるので、実行中のものは完了させる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: upload
    # App Store Connect にアプリが無いリポジトリは ENABLE_DELIVERY=false でスキップする（Upload と同じ）
    if: vars.ENABLE_DELIVERY != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify metadata
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: python3 Tools/upload_metadata.py --check --languages "$LANGUAGES"

      - name: Create Private Key
        # Secrets はシェル展開ではなく env 経由で渡す
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Install dependencies
        id: venv
        run: |
          set -euo pipefail
          # PyJWT は標準では入っていないので、この実行かぎりの venv に入れる
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check pyjwt cryptography

      - name: Upload to App Store Connect (iOS)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
          LANGUAGES: ${{ inputs.languages }}
          APP_VERSION: ${{ inputs.app_version }}
          MISSING_LOCALES: ${{ inputs.missing_locales }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          options=(--missing-locales "$MISSING_LOCALES")
          if [ -n "$LANGUAGES" ]; then
            options+=(--languages "$LANGUAGES")
          fi
          if [ -n "$APP_VERSION" ]; then
            options+=(--app-version "$APP_VERSION")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            options+=(--dry-run)
          fi

          # Bundle ID は Configs/Project.xcconfig から読む（ワークフローに書き写すと二重管理になるため）
          .venv/bin/python -u Tools/upload_metadata.py --platform IOS "${options[@]}" | tee "$RUNNER_TEMP/upload-ios.log"

      - name: Upload to App Store Connect (macOS)
        # iOS が失敗しても macOS は反映する（片方の失敗をもう片方に響かせない。run の結果は失敗になる）
        if: ${{ !cancelled() && steps.venv.outcome == 'success' && vars.ENABLE_MACOS_DELIVERY != 'false' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
          LANGUAGES: ${{ inputs.languages }}
          APP_VERSION: ${{ inputs.app_version }}
          MISSING_LOCALES: ${{ inputs.missing_locales }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          options=(--missing-locales "$MISSING_LOCALES")
          if [ -n "$LANGUAGES" ]; then
            options+=(--languages "$LANGUAGES")
          fi
          if [ -n "$APP_VERSION" ]; then
            options+=(--app-version "$APP_VERSION")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            options+=(--dry-run)
          fi

          # macOS のバージョンが無いときは飛ばして終了コード 0 で終わる（ログに「macOS の反映を飛ばしました」と出る）
          .venv/bin/python -u Tools/upload_metadata.py --platform MAC_OS --missing-version skip "${options[@]}" \
            | tee "$RUNNER_TEMP/upload-macos.log"

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ENABLE_MACOS_DELIVERY: ${{ vars.ENABLE_MACOS_DELIVERY }}
        run: |
          set -euo pipefail
          {
            echo "## App Store のメタデータ"
            echo
            echo "- 反映: $([ "$DRY_RUN" = "true" ] && echo "しない（dry-run）" || echo "する")"
            if [ "$ENABLE_MACOS_DELIVERY" = "false" ]; then
              echo "- macOS: リポジトリ変数 ENABLE_MACOS_DELIVERY が false なので反映していません"
            elif [ -f "$RUNNER_TEMP/upload-macos.log" ] && grep -qF "macOS の反映を飛ばしました" "$RUNNER_TEMP/upload-macos.log"; then
              echo "- macOS: App Store Connect に反映先の macOS のバージョンが無いため、iOS だけに反映しました。"
              echo "  macOS にも載せるときは、App Store Connect でアプリに macOS のプラットフォームを追加し、バージョンを用意してから再実行してください（docs/release.md）"
            fi
            for platform in ios macos; do
              log="$RUNNER_TEMP/upload-${platform}.log"
              [ -f "$log" ] || continue
              echo
              echo "### $([ "$platform" = "ios" ] && echo iOS || echo macOS)"
              echo
              echo '```diff'
              cat "$log"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
